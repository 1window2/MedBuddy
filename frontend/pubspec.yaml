name: medbuddy_frontend
description: A Flutter medication management client for MedBuddy.
publish_to: 'none'
version: 0.1.0+11

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  camera: ^0.12.0+2
  firebase_app_check: ^0.4.5+2
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  firebase_messaging: ^16.4.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_tts: ^4.2.5
  google_mlkit_text_recognition: ^0.16.0
  google_sign_in: 7.2.0
  http: ^1.2.0
  image_picker: ^1.1.0
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  timezone: ^0.11.0
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
