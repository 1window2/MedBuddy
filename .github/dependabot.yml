# File Name: dependabot.yml
# Role: Schedules one monthly dependency update proposal covering Python, Flutter and GitHub Actions.

version: 2

# Every ecosystem below belongs to this group, so version updates arrive as a
# single pull request once a month instead of one pull request per package.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "backend"
      - "frontend"
      - "github-actions"

updates:
  # Python backend dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"

    ignore:
      # Backend CI currently targets Python 3.11;
      # numpy 2.5+ requires Python 3.12.
      - dependency-name: "numpy"
        versions:
          - ">=2.5.0"

  # Flutter and Dart package updates
  - package-ecosystem: "pub"
    directory: "/frontend"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
