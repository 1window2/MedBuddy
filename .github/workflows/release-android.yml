# File Name: release-android.yml
# Role: Validates production configuration and builds verified, signed Android artifacts.

name: Build Signed Android Release

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Optional public HTTPS API URL for an isolated beta build
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify-ci:
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/beta/v0.2.0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Source Code Checkout
        uses: actions/checkout@v7
      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_release_ci.py

  build:
    needs: verify-ci
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/beta/v0.2.0'
    runs-on: ubuntu-latest
    environment: beta-android
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Source Code Checkout
        uses: actions/checkout@v7

      - name: Validate release ref
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" || \
             "${GITHUB_REF}" == "refs/heads/beta/v0.2.0" ]] || {
            echo "Signed Android builds are restricted to main and the active beta branch." >&2
            exit 1
          }

      - name: Java Setup
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - name: Flutter Setup
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Package Get
        run: flutter pub get --enforce-lockfile

      - name: Validate Naver Map client
        shell: bash
        env:
          NAVER_MAP_CLIENT_ID: ${{ vars.NAVER_MAP_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [[ ! "${NAVER_MAP_CLIENT_ID}" =~ ^[A-Za-z0-9_-]{5,100}$ ]]; then
            echo "NAVER_MAP_CLIENT_ID is missing or malformed." >&2
            exit 1
          fi

      - name: Normalize release App Check policy
        shell: bash
        env:
          FIREBASE_APP_CHECK_REQUIRED: ${{ vars.FIREBASE_APP_CHECK_REQUIRED }}
          APP_CHECK_RELEASE_DISTRIBUTION: ${{ vars.APP_CHECK_RELEASE_DISTRIBUTION }}
        run: |
          set -euo pipefail
          python3 ../scripts/check_android_release_configuration.py policy

      - name: Authenticate read-only Firebase preflight
        if: env.MEDBUDDY_APP_CHECK_REQUIRED_NORMALIZED == 'true'
        id: app-check-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_APP_CHECK_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_APP_CHECK_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false

      - name: Verify live Firebase App Check release configuration
        if: env.MEDBUDDY_APP_CHECK_REQUIRED_NORMALIZED == 'true'
        shell: bash
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.app-check-auth.outputs.access_token }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_PROJECT_NUMBER: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          UPLOAD_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          PLAY_CERT_SHA256: ${{ vars.ANDROID_PLAY_SIGNING_CERT_SHA256 }}
          RELEASE_DEVICE_INTEGRITY: ${{ vars.APP_CHECK_RELEASE_DEVICE_INTEGRITY || 'NO_INTEGRITY' }}
        run: |
          set -euo pipefail
          python3 ../scripts/check_release_app_check.py \
            --project-id "${FIREBASE_PROJECT_ID}" \
            --project-number "${FIREBASE_PROJECT_NUMBER}" \
            --app-id "${FIREBASE_APP_ID}" \
            --upload-cert-sha256 "${UPLOAD_CERT_SHA256}" \
            --play-cert-sha256 "${PLAY_CERT_SHA256}" \
            --distribution "${MEDBUDDY_RELEASE_DISTRIBUTION}" \
            --device-integrity "${RELEASE_DEVICE_INTEGRITY}"

      - name: Validate standalone backend endpoint
        shell: bash
        env:
          MEDBUDDY_API_BASE_URL: ${{ github.ref == 'refs/heads/beta/v0.2.0' && inputs.api_base_url || vars.MEDBUDDY_API_BASE_URL }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          BACKEND_ORIGIN="$(python3 ../scripts/check_android_release_configuration.py backend-origin)"
          printf 'BACKEND_ORIGIN=%s\n' "${BACKEND_ORIGIN}" >> "${GITHUB_ENV}"
          python3 ../scripts/check_release_ingress.py --origin "${BACKEND_ORIGIN}"
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 \
            "${BACKEND_ORIGIN}/health" > "${RUNNER_TEMP}/backend-health.json"
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 \
            "${BACKEND_ORIGIN}/ready" > "${RUNNER_TEMP}/backend-ready.json"
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 \
            "${BACKEND_ORIGIN}/ready/catalogs" > "${RUNNER_TEMP}/backend-catalogs.json"
          python3 ../scripts/check_android_release_configuration.py backend-readiness \
            --probe-directory "${RUNNER_TEMP}" \
            --contract-file ../backend/API_CONTRACT_VERSION

      - name: Restore Firebase Android configuration
        shell: bash
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "${FIREBASE_CONFIG_BASE64}" \
            | base64 --decode \
            > android/app/google-services.json

      - name: Validate Firebase release configuration
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_ANDROID_CERT_SHA1: ${{ vars.ANDROID_SIGNING_CERT_SHA1 }}
        run: |
          set -euo pipefail
          python3 ../scripts/check_android_release_configuration.py firebase \
            --configuration android/app/google-services.json

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "${KEYSTORE_BASE64}" \
            | base64 --decode \
            > "${RUNNER_TEMP}/medbuddy-release.jks"

      - name: Build signed APK and app bundle
        shell: bash
        env:
          MEDBUDDY_KEYSTORE_PATH: ${{ runner.temp }}/medbuddy-release.jks
          MEDBUDDY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEDBUDDY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEDBUDDY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MEDBUDDY_REQUIRE_RELEASE_SIGNING: 'true'
          EXPECTED_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          MEDBUDDY_API_BASE_URL: ${{ github.ref == 'refs/heads/beta/v0.2.0' && inputs.api_base_url || vars.MEDBUDDY_API_BASE_URL }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          NAVER_MAP_CLIENT_ID: ${{ vars.NAVER_MAP_CLIENT_ID }}
        run: |
          set -euo pipefail
          APP_CHECK_REQUIRED="${MEDBUDDY_APP_CHECK_REQUIRED_NORMALIZED}"
          EXPECTED_CERT="$(printf '%s' "${EXPECTED_SIGNING_CERT_SHA256}" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          ACTUAL_CERT="$(keytool -list -v \
            -keystore "${MEDBUDDY_KEYSTORE_PATH}" \
            -alias "${MEDBUDDY_KEY_ALIAS}" \
            -storepass:env MEDBUDDY_KEYSTORE_PASSWORD \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]')"
          test -n "${EXPECTED_CERT}"
          test "${ACTUAL_CERT}" = "${EXPECTED_CERT}"
          COMMON_DEFINES=(
            --dart-define=MEDBUDDY_AUTH_MODE=firebase
            --dart-define=MEDBUDDY_PHONE_AUTH_ENABLED=false
            "--dart-define=MEDBUDDY_API_BASE_URL=${MEDBUDDY_API_BASE_URL}"
            "--dart-define=MEDBUDDY_FIREBASE_API_KEY=${FIREBASE_API_KEY}"
            "--dart-define=MEDBUDDY_FIREBASE_APP_ID=${FIREBASE_APP_ID}"
            "--dart-define=MEDBUDDY_FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}"
            "--dart-define=MEDBUDDY_FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}"
            "--dart-define=MEDBUDDY_NAVER_MAP_CLIENT_ID=${NAVER_MAP_CLIENT_ID}"
          )
          if [[ "${MEDBUDDY_BUILD_DIRECT_APK}" == "true" ]]; then
            flutter build apk --release --no-pub \
              "${COMMON_DEFINES[@]}" \
              "--dart-define=MEDBUDDY_FIREBASE_APP_CHECK_REQUIRED=${APP_CHECK_REQUIRED}"
            sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app-release.apk.sha256
          fi
          flutter build appbundle --release --no-pub \
            "${COMMON_DEFINES[@]}" \
            --dart-define=MEDBUDDY_FIREBASE_APP_CHECK_REQUIRED=true
          sha256sum build/app/outputs/bundle/release/app-release.aab > build/app-release.aab.sha256
          printf '%s\n' \
            "App Check required for APK: ${APP_CHECK_REQUIRED}" \
            "Protected distribution: ${MEDBUDDY_RELEASE_DISTRIBUTION}" \
            "Direct APK included: ${MEDBUDDY_BUILD_DIRECT_APK}" \
            'AAB always requires App Check; Play/device acceptance remains a separate publication gate.' \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify signed release artifacts
        shell: bash
        env:
          EXPECTED_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          EXPECTED_CERT="$(printf '%s' "${EXPECTED_SIGNING_CERT_SHA256}" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "${EXPECTED_CERT}"
          if [[ "${MEDBUDDY_BUILD_DIRECT_APK}" == "true" ]]; then
            APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            test -x "${APKSIGNER}"
            set +e
            APK_VERIFY_OUTPUT="$("${APKSIGNER}" verify --verbose --print-certs "${APK}" 2>&1)"
            APK_VERIFY_STATUS=$?
            set -e
            printf '%s\n' "${APK_VERIFY_OUTPUT}"
            if (( APK_VERIFY_STATUS != 0 )); then
              echo "APK signature verification failed with exit code ${APK_VERIFY_STATUS}." >&2
              exit "${APK_VERIFY_STATUS}"
            fi
            APK_CERT="$(printf '%s\n' "${APK_VERIFY_OUTPUT}" \
              | awk -F': ' '/^(Signer #[0-9]+|V[0-9]+ Signer): certificate SHA-256 digest: [[:xdigit:]:]+$/ { print $NF; exit }' \
              | head -n 1 \
              | tr -d ':[:space:]' \
              | tr '[:lower:]' '[:upper:]')"
            if [[ ! "${APK_CERT}" =~ ^[0-9A-F]{64}$ ]]; then
              echo "APK certificate fingerprint extraction failed." >&2
              exit 1
            fi
            if [[ "${APK_CERT}" != "${EXPECTED_CERT}" ]]; then
              echo "APK signing certificate SHA-256 mismatch." >&2
              exit 1
            fi
          fi
          set +e
          AAB_VERIFY_OUTPUT="$(jarsigner -verify "${AAB}" 2>&1)"
          AAB_VERIFY_STATUS=$?
          set -e
          printf '%s\n' "${AAB_VERIFY_OUTPUT}"
          if (( AAB_VERIFY_STATUS != 0 )); then
            echo "AAB signature verification failed with exit code ${AAB_VERIFY_STATUS}." >&2
            exit "${AAB_VERIFY_STATUS}"
          fi
          if ! grep -Eq '^jar verified\.$' <<< "${AAB_VERIFY_OUTPUT}"; then
            echo "AAB signature verification did not report a verified archive." >&2
            exit 1
          fi
          if grep -Eqi 'unsigned entries|treated as unsigned' <<< "${AAB_VERIFY_OUTPUT}"; then
            echo "AAB signature verification reported unsigned content." >&2
            exit 1
          fi
          AAB_CERT="$(keytool -printcert -jarfile "${AAB}" \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]')"

          if [[ ! "${AAB_CERT}" =~ ^[0-9A-F]{64}$ ]]; then
            echo "AAB certificate fingerprint extraction failed." >&2
            exit 1
          fi
          if [[ "${AAB_CERT}" != "${EXPECTED_CERT}" ]]; then
            echo "AAB signing certificate SHA-256 mismatch." >&2
            exit 1
          fi

      - name: Upload signed Play bundle
        uses: actions/upload-artifact@v7
        with:
          name: medbuddy-android-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            frontend/build/app/outputs/bundle/release/app-release.aab
            frontend/build/app-release.aab.sha256

      - name: Upload signed direct APK
        if: env.MEDBUDDY_BUILD_DIRECT_APK == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: medbuddy-android-apk-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            frontend/build/app/outputs/flutter-apk/app-release.apk
            frontend/build/app-release.apk.sha256
