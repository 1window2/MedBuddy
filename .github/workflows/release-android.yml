name: Build Signed Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: beta-android

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Source Code Checkout
        uses: actions/checkout@v6

      - name: Validate release ref
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/heads/main|refs/heads/beta/*|refs/tags/v*) ;;
            *)
              echo "Android releases are restricted to main, beta branches, and version tags." >&2
              exit 1
              ;;
          esac

      - name: Java Setup
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Flutter Setup
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Package Get
        run: flutter pub get

      - name: Validate standalone backend endpoint
        shell: bash
        env:
          MEDBUDDY_API_BASE_URL: ${{ vars.MEDBUDDY_API_BASE_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import ipaddress
          import os
          from urllib.parse import urlsplit

          raw_url = os.environ.get("MEDBUDDY_API_BASE_URL", "").strip()
          parsed = urlsplit(raw_url)
          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or parsed.username
              or parsed.password
              or parsed.query
              or parsed.fragment
              or parsed.path != "/api/v1/medication"
          ):
              raise SystemExit(
                  "MEDBUDDY_API_BASE_URL must be a public HTTPS URL ending in "
                  "/api/v1/medication."
              )
          if parsed.hostname.lower() == "localhost":
              raise SystemExit("The signed release cannot target localhost.")
          try:
              address = ipaddress.ip_address(parsed.hostname)
          except ValueError:
              pass
          else:
              if not address.is_global:
                  raise SystemExit(
                      "The signed release cannot target a private or loopback IP."
                  )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"BACKEND_ORIGIN={parsed.scheme}://{parsed.netloc}\n")
          PY
          BACKEND_ORIGIN="$(python - <<'PY'
          import os
          from urllib.parse import urlsplit
          parsed = urlsplit(os.environ["MEDBUDDY_API_BASE_URL"].strip())
          print(f"{parsed.scheme}://{parsed.netloc}")
          PY
          )"
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 \
            "${BACKEND_ORIGIN}/health" > "${RUNNER_TEMP}/backend-health.json"
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 \
            "${BACKEND_ORIGIN}/ready" > "${RUNNER_TEMP}/backend-ready.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_contract = (
              Path("../backend/API_CONTRACT_VERSION")
              .read_text(encoding="utf-8")
              .strip()
          )
          for probe_name in ("backend-health.json", "backend-ready.json"):
              payload = json.loads(
                  Path(os.environ["RUNNER_TEMP"])
                  .joinpath(probe_name)
                  .read_text(encoding="utf-8")
              )
              if payload.get("api_contract") != expected_contract:
                  raise SystemExit(
                      "The standalone backend API contract does not match the "
                      "Android release contract."
                  )
          PY

      - name: Restore Firebase Android configuration
        shell: bash
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "${FIREBASE_CONFIG_BASE64}" \
            | base64 --decode \
            > android/app/google-services.json

      - name: Validate Firebase release configuration
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_ANDROID_CERT_SHA1: ${{ vars.ANDROID_SIGNING_CERT_SHA1 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_package = "com.medbuddy.app"
          config = json.loads(
              Path("android/app/google-services.json").read_text(encoding="utf-8")
          )
          project = config["project_info"]
          clients = [
              client
              for client in config.get("client", [])
              if client.get("client_info", {})
              .get("android_client_info", {})
              .get("package_name")
              == expected_package
          ]
          if len(clients) != 1:
              raise SystemExit(
                  "google-services.json must contain exactly one MedBuddy Android client."
              )
          client = clients[0]
          checks = {
              "project ID": (
                  project.get("project_id"),
                  os.environ["FIREBASE_PROJECT_ID"],
              ),
              "sender ID": (
                  str(project.get("project_number", "")),
                  os.environ["FIREBASE_MESSAGING_SENDER_ID"],
              ),
              "app ID": (
                  client.get("client_info", {}).get("mobilesdk_app_id"),
                  os.environ["FIREBASE_APP_ID"],
              ),
              "API key": (
                  next(
                      (
                          item.get("current_key")
                          for item in client.get("api_key", [])
                          if item.get("current_key")
                      ),
                      None,
                  ),
                  os.environ["FIREBASE_API_KEY"],
              ),
          }
          mismatches = [
              name
              for name, (actual, expected) in checks.items()
              if not expected or actual != expected
          ]
          expected_sha1 = (
              os.environ["FIREBASE_ANDROID_CERT_SHA1"]
              .replace(":", "")
              .strip()
              .lower()
          )
          registered_sha1 = {
              item.get("android_info", {}).get("certificate_hash", "").lower()
              for item in client.get("oauth_client", [])
              if item.get("client_type") == 1
          }
          if not expected_sha1 or expected_sha1 not in registered_sha1:
              mismatches.append("release SHA-1")
          if mismatches:
              raise SystemExit(
                  "Firebase release configuration mismatch: "
                  + ", ".join(mismatches)
              )
          PY

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "${KEYSTORE_BASE64}" \
            | base64 --decode \
            > "${RUNNER_TEMP}/medbuddy-release.jks"

      - name: Build signed APK and app bundle
        shell: bash
        env:
          MEDBUDDY_KEYSTORE_PATH: ${{ runner.temp }}/medbuddy-release.jks
          MEDBUDDY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEDBUDDY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEDBUDDY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MEDBUDDY_REQUIRE_RELEASE_SIGNING: 'true'
          EXPECTED_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          MEDBUDDY_API_BASE_URL: ${{ vars.MEDBUDDY_API_BASE_URL }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          EXPECTED_CERT="$(printf '%s' "${EXPECTED_SIGNING_CERT_SHA256}" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          ACTUAL_CERT="$(keytool -list -v \
            -keystore "${MEDBUDDY_KEYSTORE_PATH}" \
            -alias "${MEDBUDDY_KEY_ALIAS}" \
            -storepass:env MEDBUDDY_KEYSTORE_PASSWORD \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]')"
          test -n "${EXPECTED_CERT}"
          test "${ACTUAL_CERT}" = "${EXPECTED_CERT}"
          DEFINES=(
            --dart-define=MEDBUDDY_AUTH_MODE=firebase
            --dart-define=MEDBUDDY_PHONE_AUTH_ENABLED=false
            "--dart-define=MEDBUDDY_API_BASE_URL=${MEDBUDDY_API_BASE_URL}"
            "--dart-define=MEDBUDDY_FIREBASE_API_KEY=${FIREBASE_API_KEY}"
            "--dart-define=MEDBUDDY_FIREBASE_APP_ID=${FIREBASE_APP_ID}"
            "--dart-define=MEDBUDDY_FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}"
            "--dart-define=MEDBUDDY_FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}"
          )
          flutter build apk --release --no-pub "${DEFINES[@]}"
          flutter build appbundle --release --no-pub "${DEFINES[@]}"
          sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app-release.apk.sha256
          sha256sum build/app/outputs/bundle/release/app-release.aab > build/app-release.aab.sha256

      - name: Verify signed release artifacts
        shell: bash
        env:
          EXPECTED_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          EXPECTED_CERT="$(printf '%s' "${EXPECTED_SIGNING_CERT_SHA256}" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "${EXPECTED_CERT}"
          test -x "${APKSIGNER}"

          set +e
          APK_VERIFY_OUTPUT="$("${APKSIGNER}" verify --verbose --print-certs "${APK}" 2>&1)"
          APK_VERIFY_STATUS=$?
          set -e
          printf '%s\n' "${APK_VERIFY_OUTPUT}"
          if (( APK_VERIFY_STATUS != 0 )); then
            echo "APK signature verification failed with exit code ${APK_VERIFY_STATUS}." >&2
            exit "${APK_VERIFY_STATUS}"
          fi

          APK_CERT="$(printf '%s\n' "${APK_VERIFY_OUTPUT}" \
            | awk -F': ' '/[Ss]igner.*certificate SHA-256 digest:/ { print $NF; exit }' \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]')"
          jarsigner -verify "${AAB}"
          AAB_CERT="$(keytool -printcert -jarfile "${AAB}" \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]')"

          if [[ -z "${APK_CERT}" ]]; then
            echo "APK certificate fingerprint extraction failed." >&2
            exit 1
          fi
          if [[ -z "${AAB_CERT}" ]]; then
            echo "AAB certificate fingerprint extraction failed." >&2
            exit 1
          fi
          if [[ "${APK_CERT}" != "${EXPECTED_CERT}" ]]; then
            echo "APK signing certificate SHA-256 mismatch." >&2
            exit 1
          fi
          if [[ "${AAB_CERT}" != "${EXPECTED_CERT}" ]]; then
            echo "AAB signing certificate SHA-256 mismatch." >&2
            exit 1
          fi

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medbuddy-android-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            frontend/build/app/outputs/flutter-apk/app-release.apk
            frontend/build/app/outputs/bundle/release/app-release.aab
            frontend/build/app-release.apk.sha256
            frontend/build/app-release.aab.sha256
