name: Build Signed Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: beta-android

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Source Code Checkout
        uses: actions/checkout@v6

      - name: Java Setup
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Flutter Setup
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Package Get
        run: flutter pub get

      - name: Restore Firebase Android configuration
        shell: bash
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "${FIREBASE_CONFIG_BASE64}" \
            | base64 --decode \
            > android/app/google-services.json

      - name: Validate Firebase release configuration
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_ANDROID_CERT_SHA1: ${{ vars.ANDROID_SIGNING_CERT_SHA1 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_package = "com.medbuddy.app"
          config = json.loads(
              Path("android/app/google-services.json").read_text(encoding="utf-8")
          )
          project = config["project_info"]
          clients = [
              client
              for client in config.get("client", [])
              if client.get("client_info", {})
              .get("android_client_info", {})
              .get("package_name")
              == expected_package
          ]
          if len(clients) != 1:
              raise SystemExit(
                  "google-services.json must contain exactly one MedBuddy Android client."
              )
          client = clients[0]
          checks = {
              "project ID": (
                  project.get("project_id"),
                  os.environ["FIREBASE_PROJECT_ID"],
              ),
              "sender ID": (
                  str(project.get("project_number", "")),
                  os.environ["FIREBASE_MESSAGING_SENDER_ID"],
              ),
              "app ID": (
                  client.get("client_info", {}).get("mobilesdk_app_id"),
                  os.environ["FIREBASE_APP_ID"],
              ),
              "API key": (
                  next(
                      (
                          item.get("current_key")
                          for item in client.get("api_key", [])
                          if item.get("current_key")
                      ),
                      None,
                  ),
                  os.environ["FIREBASE_API_KEY"],
              ),
          }
          mismatches = [
              name
              for name, (actual, expected) in checks.items()
              if not expected or actual != expected
          ]
          expected_sha1 = (
              os.environ["FIREBASE_ANDROID_CERT_SHA1"]
              .replace(":", "")
              .strip()
              .lower()
          )
          registered_sha1 = {
              item.get("android_info", {}).get("certificate_hash", "").lower()
              for item in client.get("oauth_client", [])
              if item.get("client_type") == 1
          }
          if not expected_sha1 or expected_sha1 not in registered_sha1:
              mismatches.append("release SHA-1")
          if mismatches:
              raise SystemExit(
                  "Firebase release configuration mismatch: "
                  + ", ".join(mismatches)
              )
          PY

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "${KEYSTORE_BASE64}" \
            | base64 --decode \
            > "${RUNNER_TEMP}/medbuddy-release.jks"

      - name: Build signed APK and app bundle
        shell: bash
        env:
          MEDBUDDY_KEYSTORE_PATH: ${{ runner.temp }}/medbuddy-release.jks
          MEDBUDDY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEDBUDDY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEDBUDDY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MEDBUDDY_REQUIRE_RELEASE_SIGNING: 'true'
          EXPECTED_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          MEDBUDDY_API_BASE_URL: ${{ vars.MEDBUDDY_API_BASE_URL }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          EXPECTED_CERT="$(printf '%s' "${EXPECTED_SIGNING_CERT_SHA256}" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          ACTUAL_CERT="$(keytool -list -v \
            -keystore "${MEDBUDDY_KEYSTORE_PATH}" \
            -alias "${MEDBUDDY_KEY_ALIAS}" \
            -storepass:env MEDBUDDY_KEYSTORE_PASSWORD \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]')"
          test -n "${EXPECTED_CERT}"
          test "${ACTUAL_CERT}" = "${EXPECTED_CERT}"
          DEFINES=(
            --dart-define=MEDBUDDY_AUTH_MODE=firebase
            "--dart-define=MEDBUDDY_API_BASE_URL=${MEDBUDDY_API_BASE_URL}"
            "--dart-define=MEDBUDDY_FIREBASE_API_KEY=${FIREBASE_API_KEY}"
            "--dart-define=MEDBUDDY_FIREBASE_APP_ID=${FIREBASE_APP_ID}"
            "--dart-define=MEDBUDDY_FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}"
            "--dart-define=MEDBUDDY_FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}"
          )
          flutter build apk --release --no-pub "${DEFINES[@]}"
          flutter build appbundle --release --no-pub "${DEFINES[@]}"
          sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app-release.apk.sha256
          sha256sum build/app/outputs/bundle/release/app-release.aab > build/app-release.aab.sha256

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medbuddy-android-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            frontend/build/app/outputs/flutter-apk/app-release.apk
            frontend/build/app/outputs/bundle/release/app-release.aab
            frontend/build/app-release.apk.sha256
            frontend/build/app-release.aab.sha256
