# 파일명: sync-drug-catalog.yml
# 역할: 공공 약품 카탈로그 동기화 작업을 정의하며 현재 자체 서버 운영에서는 클라우드 예약 실행을 막는다.

name: Synchronize Drug Catalog

# No schedule while self-hosted: a scheduled trigger on a disabled job only created a
# skipped run every week. Restore `schedule: - cron: "30 18 * * 0"` with the job.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: beta-drug-catalog-writer
  cancel-in-progress: false

jobs:
  synchronize:
    # Disabled while the beta backend is self-hosted. Keep the source for a
    # later managed deployment without allowing scheduled GCP execution.
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: beta-backend
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Synchronize public medication data
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs execute "${{ vars.GCP_CATALOG_SYNC_JOB }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --wait
