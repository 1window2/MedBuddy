# File Name: frontend-ci.yml
# Role: Validates Flutter source, tests and the compile-only Android release build.

name: Flutter CI

on:
  push:
    branches: [ "main", "beta/**" ]
  pull_request:
    branches: [ "main", "beta/**" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Source Code Checkout
      uses: actions/checkout@v7

    - name: Java Setup (for Flutter)
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Flutter Setup
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.5'
        channel: 'stable'
        cache: true

    - name: Validate release metadata
      run: python3 ../scripts/check_release_metadata.py

    - name: Package Get
      run: flutter pub get --enforce-lockfile

    - name: Dart Code Analysis
      run: flutter analyze --no-pub

    - name: Run Flutter Tests
      run: flutter test --no-pub

    - name: Run Synthetic Nearby Care Marker Regressions
      run: flutter test --no-pub --dart-define=MEDBUDDY_NAVER_MAP_CLIENT_ID=test-only test/nearby_care_marker_diff_test.dart

    - name: Prepare compile-only Firebase configuration
      shell: bash
      run: cp android/app/google-services.json.example android/app/google-services.json

    - name: Android Release APK Build Test
      run: flutter build apk --release --no-pub
